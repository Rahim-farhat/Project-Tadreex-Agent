# /etc/nginx/sites-available/scenarios.tadreex.com
# HTTPS is added by: sudo certbot --nginx -d scenarios.tadreex.com
# Ports must match SERVER_HOST_PORT / CLIENT_HOST_PORT (defaults 5190 / 3190).

server {
    listen 80;
    listen [::]:80;
    server_name scenarios.tadreex.com;

    client_max_body_size 10m;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/ {
        proxy_pass http://127.0.0.1:5190;
        # AI replies can take a while
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:3190;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
