name: scenarios-platform

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-scenarios}
      POSTGRES_USER: ${POSTGRES_USER:-scenarios}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  server:
    build: ./server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-scenarios}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-scenarios}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      GROQ_API_KEY: ${GROQ_API_KEY:?Set GROQ_API_KEY in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NAME: ${ADMIN_NAME:-Admin}
      CLIENT_URL: https://${DOMAIN:-scenarios.tadreex.com}
      PORT: 5000
      # Only read by the one-off MongoDB migration script
      MONGODB_URI: ${MONGODB_URI:-}

  client:
    build:
      context: ./client
      args:
        API_URL: http://server:5000
    restart: unless-stopped
    depends_on:
      - server

  # Reverse proxy with automatic HTTPS (Let's Encrypt).
  # Needs ports 80 and 443 free on the VPS and the DOMAIN's DNS pointing here.
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      - client
      - server
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-scenarios.tadreex.com}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
